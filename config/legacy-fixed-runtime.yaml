translation:
  cpu_threads: 4
  max_text_length: 512
  prefer_engine: opus
  engines:
    opus_ur_en:
      enabled: true
      repo: Helsinki-NLP/opus-mt-ur-en
      model_dir: models/translation/opus-ur-en
    opus_en_ur:
      enabled: true
      repo: Helsinki-NLP/opus-mt-en-ur
      model_dir: models/translation/opus-en-ur
    indictrans2_ur_en:
      enabled: false
      repo: ai4bharat/indictrans2-indic-en-dist-200M
      model_dir: models/translation/indictrans2-ur-en-200M
      trust_remote_code: true
    indictrans2_en_ur:
      enabled: false
      repo: ai4bharat/indictrans2-en-indic-dist-200M
      model_dir: models/translation/indictrans2-en-ur-200M
      trust_remote_code: true
clustering:
  similarity_threshold: 0.72
  lexical_weight: 0.3
  entity_weight: 0.4
  embedding_weight: 0.3
  max_story_age_hours: 24
  engine: multilingual-e5-small
  semantic_threshold: 0.78
  entity_semantic_threshold: 0.62
  lexical_threshold: 0.58
embeddings:
  model_repo: intfloat/multilingual-e5-small
  model_dir: models/embeddings/multilingual-e5-small
  dimension: 384
  max_length: 256
keywords:
  watch_mode: false
  fuzzy_threshold: 0.88
  items: []
