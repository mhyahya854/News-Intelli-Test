application:
  name: News Statement Detector
  version: 1.0.0
  host: 127.0.0.1
  port: 8000
  timezone: Asia/Karachi
  log_level: INFO
  analysis_fps: 8
  data_dir: data
  diagnostics_dir: data/diagnostics
  evidence_dir: data/evidence
  recordings_dir: data/recordings
  frontend_dist: frontend/dist
  store_empty_ocr: false
  live_queue_size: 200
  archival:
    enabled: true
    segment_seconds: 900
    retention_days: 7
    cleanup_on_start: true
  ticker_buffer_window: 5
  ticker_buffer_seconds: 12.0
  evidence_jpeg_quality: 92
  evidence_workers: 2
  ticker_min_fps: 2.0
  ocr_preprocessing: true
database:
  url: ${NEWS_DATABASE_URL:postgresql+psycopg://postgres:postgres@localhost:5432/news}
  echo: false
ocr:
  engine: paddle
  mixed_min_confidence: 0.45
  models:
    en:
      paddle_lang: en
    ur:
      paddle_lang: ar
intelligence:
  thresholds:
    collect_min_confidence: 0.75
    review_min_confidence: 0.45
    minimum_ocr_confidence: 0.45
    duplicate_window_seconds: 30
    duplicate_similarity: 0.9
    context_window_seconds: 12
    context_max_items: 24
